# Maps workflow step factors to semantically meaningful datapoints.

it_kb_ingest:
  "0":
    guardrail:
      object_type: service
      datapoint: status
      factor_type: boolean
      operator: regex
      value: "^active$"
    use-case:
      object_type: knowledge_article
      datapoint: status
      factor_type: frequency
      operator: null
      value: null
  "1":
    guardrail:
      object_type: service
      datapoint: compliance_status
      factor_type: boolean
      operator: regex
      value: "^compliant$"
    use-case:
      object_type: repository
      datapoint: last_updated
      factor_type: frequency
      operator: null
      value: null

